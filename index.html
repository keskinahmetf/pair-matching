<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find a Pair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#16213B; --muted:#5A6580;
  --line:#D5DAE4; --back:#2449D8; --back-2:#3A5DF0; --match:#FFC93C; --match-ink:#3A2A00;
  --focus:#FF7A1A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1424; --surface:#182036; --ink:#E9EDF7; --muted:#9AA5C0; --line:#2A3452;
    --back:#3557E8; --back-2:#4C6CF5; --match:#FFC93C; --match-ink:#3A2A00; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#182036; --ink:#E9EDF7; --muted:#9AA5C0; --line:#2A3452;
  --back:#3557E8; --back-2:#4C6CF5; --match:#FFC93C; --match-ink:#3A2A00; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:17px; line-height:1.45; min-height:100%;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.wrap{max-width:720px;margin:0 auto;padding:24px 20px 40px;display:grid;gap:22px;justify-items:center}
main{width:min(100%, 640px, calc(100vh - 230px));min-width:280px}

header.top{width:min(100%, 640px);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-weight:800;font-size:clamp(2.2rem,5vw,3.6rem);line-height:.95;letter-spacing:-.03em}
.player{color:var(--muted);font-size:.95rem}
.player strong{color:var(--ink);font-weight:600}

/* stats */
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 16px;min-width:110px}
.stat span{display:block;color:var(--muted);font-size:.85rem}
.stat b{font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats .spacer{flex:1}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.6vw,14px);width:100%}
.card{position:relative;aspect-ratio:1;border:0;padding:0;background:none;cursor:pointer;perspective:900px;border-radius:16px}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1)}
.card.up .inner,.card.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:grid;place-items:center}
.back{
  background:
    repeating-linear-gradient(45deg, transparent 0 9px, rgba(255,255,255,.09) 9px 18px),
    var(--back);
  box-shadow:inset 0 0 0 5px var(--back-2);
}
.back::after{content:"";width:28%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.55)}
.front{transform:rotateY(180deg);background:radial-gradient(circle at 50% 40%,#FFFFFF 0,#E6EBF5 100%);border:2px solid var(--line)}
.front img{width:100%;height:100%;object-fit:contain;padding:6%}
.ph{font-weight:800;font-size:clamp(1.6rem,5vw,3rem);line-height:1;width:62%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff}
.card.done .front{border-color:var(--match);box-shadow:0 0 0 3px var(--match)}
.card.done{cursor:default}
.card:hover:not(.up):not(.done) .inner{transform:translateY(-3px)}

/* leaderboard (inside the finish dialog) */
.lbBox{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.lbBox h3{margin:0 0 2px;font-size:1.3rem;font-weight:800;letter-spacing:-.01em}
.lbBox .note{margin:0 0 8px;color:var(--muted);font-size:.85rem}

/* on-screen keyboard: separate panel docked to the bottom, touch screens only */
.kbPanel{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;
  background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.25);
  padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.kbPanel.open{display:block}
.overlay.withkb{place-items:start center;padding-top:max(20px,4vh)}
.kb{max-width:960px;margin:0 auto;display:grid;gap:8px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.kb .r{display:flex;gap:7px;justify-content:center}
.kb button{flex:1 1 0;max-width:84px;min-height:60px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.2rem;font-weight:600;cursor:pointer;padding:0}
.kb button:active{background:var(--line)}
.kb button.wide{max-width:140px;flex:1.6 1 0;font-size:1rem}
.kb button.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kb button.space{max-width:none;flex:5 1 0}
.kb button.on{background:var(--ink);color:var(--bg)}
ol.lb{list-style:none;margin:0;padding:0}
ol.lb li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
ol.lb li:first-child{border-top:0}
ol.lb .rk{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
ol.lb li:nth-child(1) .rk{color:var(--ink)}
ol.lb .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
ol.lb .sc{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem;text-align:right}
ol.lb .sc b{color:var(--ink)}
ol.lb li.me{background:color-mix(in srgb,var(--match) 22%,transparent);border-radius:10px;padding-inline:8px;margin-inline:-8px}
.empty{color:var(--muted);padding:10px 0}

/* dialogs */
.overlay{position:fixed;inset:0;background:rgba(10,15,30,.55);display:none;place-items:center;padding:20px;z-index:20}
.overlay.open{display:grid}
.dlg{background:var(--surface);color:var(--ink);border-radius:22px;padding:28px;width:min(460px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg.wide{width:min(760px,100%)}
.dlg h2{margin:0 0 6px;font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.dlg p{margin:0 0 18px;color:var(--muted)}
.dlg label{display:block;font-weight:600;margin-bottom:6px}
.dlg input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:1.1rem}
.dlg .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.dlg .err{color:#C0362C;font-size:.9rem;min-height:1.3em;margin-top:6px}
.result{display:flex;gap:10px;margin:6px 0 16px}
.result .stat{flex:1}
.rank{font-size:1.05rem;margin-bottom:4px;color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  .card .inner{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Find a Pair</h1>
    <div class="player" id="playerLine" hidden>Playing as <strong id="playerName"></strong> · <button class="btn ghost" id="changeName" style="padding:4px 12px;font-size:.85rem">Change</button></div>
  </header>

  <main>
    <div class="stats">
      <div class="stat"><span>Flips</span><b id="flips">0</b></div>
      <div class="stat"><span>Time</span><b id="time">0:00</b></div>
      <div class="spacer"></div>
      <button class="btn ghost" id="restart">Restart</button>
    </div>
    <div class="board" id="board" aria-label="Memory cards"></div>
  </main>

</div>

<!-- name dialog -->
<div class="overlay" id="nameDlg" role="dialog" aria-modal="true" aria-labelledby="nameTitle">
  <form class="dlg" id="nameForm" novalidate>
    <h2 id="nameTitle">Who’s playing?</h2>
    <p>Match all 8 pairs with as few flips as you can. The clock starts on your first flip.</p>
    <label for="nameInput">Username</label>
    <input id="nameInput" maxlength="16" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Your name">
    <div class="err" id="nameErr"></div>
    <div class="row"><button class="btn" type="submit" style="flex:1;min-height:56px;font-size:1.15rem">Start game</button></div>
  </form>
</div>

<!-- on-screen keyboard panel (touch screens only) -->
<div class="kbPanel" id="kbPanel" aria-label="On-screen keyboard">
  <div class="kb" id="kb"></div>
</div>

<!-- win dialog -->
<div class="overlay" id="winDlg" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="dlg">
    <h2 id="winTitle">All pairs found</h2>
    <p class="rank" id="winRank"></p>
    <div class="result">
      <div class="stat"><span>Score</span><b id="winPoints">0</b></div>
      <div class="stat"><span>Flips</span><b id="winFlips">0</b></div>
      <div class="stat"><span>Time</span><b id="winTime">0:00</b></div>
    </div>
    <div class="lbBox">
      <h3>Leaderboard</h3>
      <p class="note" id="lbNote">Highest score wins.</p>
      <ol class="lb" id="lb"></ol>
    </div>
    <div class="row">
      <button class="btn" id="newPlayer" style="flex:1;min-height:56px;font-size:1.15rem">New player</button>
    </div>
  </div>
</div>

const $ = id => document.getElementById(id);
const boardEl = $("board");
let deck = [], first = null, second = null, lock = false;
let flips = 0, matched = 0, startTs = 0, timerId = null, elapsed = 0;
let player = "";
let lastScoreId = null;

/* ---------- helpers ---------- */
const fmt = ms => { const s = Math.floor(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const fmtPrecise = ms => { const s = ms/1000; return s < 60 ? s.toFixed(1)+"s" : fmt(ms); };
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- game ---------- */
function buildBoard(){
  clearInterval(timerId); timerId = null;
  flips = 0; matched = 0; elapsed = 0; startTs = 0; first = second = null; lock = false;
  $("flips").textContent = "0"; $("time").textContent = "0:00";
  deck = shuffle([...IMAGES.keys(), ...IMAGES.keys()]);
  boardEl.textContent = "";
  deck.forEach((pairId, i) => {
    const img = IMAGES[pairId];
    const b = document.createElement("button");
    b.className = "card"; b.dataset.i = i; b.dataset.pair = pairId;
    b.setAttribute("aria-label", "Hidden card");
    const inner = document.createElement("div"); inner.className = "inner";
    const back = document.createElement("div"); back.className = "face back";
    const front = document.createElement("div"); front.className = "face front";
    if (img.src) {
      const el = document.createElement("img"); el.src = img.src; el.alt = img.alt; front.appendChild(el);
    } else {
      const ph = document.createElement("div"); ph.className = "ph";
      ph.style.background = img.color; ph.textContent = pairId + 1; front.appendChild(ph);
    }
    inner.append(back, front); b.appendChild(inner);
    b.addEventListener("click", () => flip(b));
    boardEl.appendChild(b);
  });
}

function startTimer(){
  startTs = performance.now();
  timerId = setInterval(() => { $("time").textContent = fmt(performance.now() - startTs); }, 250);
}

function flip(card){
  if (lock || !player || card.classList.contains("up") || card.classList.contains("done")) return;
  if (!timerId && matched === 0 && flips === 0) startTimer();
  card.classList.add("up");
  card.setAttribute("aria-label", IMAGES[card.dataset.pair].alt);
  flips++; $("flips").textContent = flips;

  if (!first) { first = card; return; }
  second = card;
  if (first.dataset.pair === second.dataset.pair) {
    first.classList.add("done"); second.classList.add("done");
    first.classList.remove("up"); second.classList.remove("up");
    first = second = null; matched++;
    if (matched === IMAGES.length) finish();
  } else {
    lock = true;
    setTimeout(() => {
      [first, second].forEach(c => { c.classList.remove("up"); c.setAttribute("aria-label","Hidden card"); });
      first = second = null; lock = false;
    }, 850);
  }
}

async function finish(){
  elapsed = Math.round(performance.now() - startTs);
  clearInterval(timerId); timerId = null;
  $("time").textContent = fmt(elapsed);
  $("winFlips").textContent = flips;
  $("winTime").textContent = fmtPrecise(elapsed);
  $("winRank").textContent = "Saving your score…";
  setTimeout(() => openDlg("winDlg"), 500);
  const points = calcPoints(flips, elapsed);
  $("winPoints").textContent = points;
  const entry = { name: player, flips, timeMs: elapsed, points, at: Date.now() };
  const id = await saveScore(entry);
  lastScoreId = id;
  const rank = await rankOf(entry);
  $("winRank").textContent = rank ? (rank === 1 ? "New top score — you’re #1." : "You placed #" + rank + ".") : "Score saved.";
  renderLeaderboard();
}

/* ---------- scoring ----------
   Start at 1000 points.
   Each flip beyond the perfect 16 costs 10 points (flips matter most).
   Each second costs 2 points (so one wrong pair = 20 pts = 10 seconds).
   Never below 0. Higher is better. */
const SCORE_BASE = 1000, PER_EXTRA_FLIP = 10, PER_SECOND = 2, PERFECT_FLIPS = 16;
function calcPoints(f, ms){
  return Math.max(0, Math.round(SCORE_BASE - (f - PERFECT_FLIPS) * PER_EXTRA_FLIP - (ms / 1000) * PER_SECOND));
}

/* ---------- storage: shared db with local fallback ---------- */
let db = null, scores = [], usingShared = false;
const LOCAL_KEY = "findapair:scores";

function readLocal(){ try { return (JSON.parse(localStorage.getItem(LOCAL_KEY)) || []).filter(s => typeof s.points === "number"); } catch { return []; } }
function writeLocal(list){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(list)); } catch {} }

async function saveScore(entry){
  if (db && usingShared) {
    try {
      const ref = db.collection("scores").doc();
      await ref.set(entry);
      return ref.id;
    } catch (e) { usingShared = false; setNote(); }
  }
  const list = readLocal();
  const id = "l" + entry.at + Math.random().toString(36).slice(2,6);
  list.push({ ...entry, id });
  list.sort((a,b) => b.points - a.points || a.at - b.at);
  writeLocal(list.slice(0, 200));
  scores = list.slice(0, 10);
  return id;
}

async function rankOf(entry){
  if (db && usingShared) {
    try {
      const snap = await db.collection("scores").where("points", ">", entry.points).get();
      return snap.size + 1;
    } catch { return null; }
  }
  return readLocal().filter(s => s.points > entry.points).length + 1;
}

function setNote(){
  const rule = "Score starts at 1000: −10 per extra flip, −2 per second.";
  $("lbNote").textContent = rule + (usingShared ? " Shared with everyone who opens this game." : " Saved on this device.");
}

function renderLeaderboard(){
  const ol = $("lb"); ol.textContent = "";
  if (!scores.length) {
    const li = document.createElement("li"); li.className = "empty"; li.style.display = "block";
    li.textContent = "No scores yet. Finish a game to take the top spot.";
    ol.appendChild(li); return;
  }
  scores.forEach((s, i) => {
    const li = document.createElement("li");
    if (s.id && s.id === lastScoreId) li.className = "me";
    const rk = document.createElement("span"); rk.className = "rk"; rk.textContent = i + 1;
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = s.name || "Player";
    const sc = document.createElement("span"); sc.className = "sc";
    const b = document.createElement("b"); b.textContent = s.points + " pts";
    sc.append(b, document.createTextNode("  " + s.flips + " flips, " + fmtPrecise(s.timeMs)));
    li.append(rk, nm, sc); ol.appendChild(li);
  });
}

async function initStorage(){
  scores = readLocal().slice(0, 10); setNote(); renderLeaderboard();
  if (!window.claude || !window.claude.use) return;
  try { db = await window.claude.use("db"); } catch { db = null; }
  if (!db) return;
  usingShared = true; setNote();
  let loaded = false;
  const t = setTimeout(() => { if (!loaded) $("lbNote").textContent = "Can’t reach the shared leaderboard yet. Scores still count."; }, 10000);
  db.collection("scores").orderBy("points", "desc").limit(10).onSnapshot(snap => {
    if (!snap.metadata.fromCache) { loaded = true; clearTimeout(t); setNote(); }
    scores = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(s => typeof s.points === "number");
    renderLeaderboard();
  }, () => { clearTimeout(t); usingShared = false; scores = readLocal().slice(0,10); setNote(); renderLeaderboard(); });
}

/* ---------- dialogs & player ---------- */
function openDlg(id){ $(id).classList.add("open"); const f = $(id).querySelector("input,button"); f && f.focus(); }
function closeDlg(id){ $(id).classList.remove("open"); }

/* touch detection: show the keyboard panel only on touch screens */
const touchMQ = window.matchMedia("(pointer: coarse), (hover: none)");
let isTouch = touchMQ.matches;
function showKb(){
  if (!isTouch) return;
  $("nameInput").setAttribute("inputmode", "none");
  $("kbPanel").classList.add("open");
  $("nameDlg").classList.add("withkb");
}
function hideKb(){
  $("kbPanel").classList.remove("open");
  $("nameDlg").classList.remove("withkb");
}
/* a touch on the name field also turns the panel on (touch laptops, kiosks that misreport) */
$("nameInput").addEventListener("pointerdown", e => {
  if (e.pointerType === "touch" && !isTouch) { isTouch = true; showKb(); }
});

function askName(){
  $("nameInput").value = ""; $("nameErr").textContent = "";
  window.resetKeyboard && window.resetKeyboard();
  showKb();
  openDlg("nameDlg");
}
$("nameForm").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("nameInput").value.trim().replace(/\s+/g, " ");
  if (!v) { $("nameErr").textContent = "Enter a username to start."; return; }
  player = v.slice(0, 16);
  $("playerName").textContent = player; $("playerLine").hidden = false;
  closeDlg("nameDlg"); hideKb(); lastScoreId = null; buildBoard(); renderLeaderboard();
  boardEl.querySelector(".card")?.focus();
});
$("changeName").addEventListener("click", askName);
$("restart").addEventListener("click", buildBoard);
/* ---------- on-screen keyboard ---------- */
(function buildKeyboard(){
  const kb = $("kb"), input = $("nameInput");
  const rows = ["1234567890", "qwertyuiop", "asdfghjkl", "zxcvbnm"];
  let shift = true;
  const letterBtns = [];
  const make = (label, cls, onPress) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; if (cls) b.className = cls;
    b.addEventListener("pointerdown", e => e.preventDefault());
    b.addEventListener("click", onPress);
    return b;
  };
  const type = ch => {
    if (input.value.length >= 16) return;
    input.value += ch; $("nameErr").textContent = "";
    if (shift && /[a-z]/i.test(ch)) { shift = false; refresh(); }
  };
  const refresh = () => {
    letterBtns.forEach(b => b.textContent = shift ? b.dataset.k.toUpperCase() : b.dataset.k);
    shiftBtn.classList.toggle("on", shift);
  };
  const shiftBtn = make("⇧ Shift", "wide", () => { shift = !shift; refresh(); });
  rows.forEach((keys, ri) => {
    const r = document.createElement("div"); r.className = "r";
    if (ri === 3) r.appendChild(shiftBtn);
    [...keys].forEach(k => {
      const b = make(k, "", () => type(shift ? k.toUpperCase() : k));
      b.dataset.k = k; if (/[a-z]/.test(k)) letterBtns.push(b);
      r.appendChild(b);
    });
    if (ri === 3) r.appendChild(make("⌫", "wide", () => {
      input.value = input.value.slice(0, -1);
      if (!input.value) { shift = true; refresh(); }
    }));
    kb.appendChild(r);
  });
  const last = document.createElement("div"); last.className = "r";
  last.append(
    make("-", "", () => type("-")),
    make("Space", "space", () => { if (input.value && !input.value.endsWith(" ")) { type(" "); shift = true; refresh(); } }),
    make("_", "", () => type("_")),
    make("Start", "wide go", () => $("nameForm").requestSubmit())
  );
  kb.appendChild(last);
  refresh();
  window.resetKeyboard = () => { shift = true; refresh(); };
})();
$("newPlayer").addEventListener("click", () => { closeDlg("winDlg"); player = ""; $("playerLine").hidden = true; buildBoard(); askName(); });

buildBoard();
askName();
initStorage();
</script>
</body>
